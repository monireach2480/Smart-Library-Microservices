# Non-secret configuration shared by every Pod.
#
# Service discovery is done with Kubernetes DNS: inside the cluster a ClusterIP Service called
# `catalog-service` resolves to catalog-service.smart-library.svc.cluster.local. Pointing the gateway at
# that one name means kube-proxy load-balances across all 3 Catalog Pods - the `X-Served-By` response
# header shows which Pod actually answered.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-library-config
  namespace: smart-library
  labels:
    app.kubernetes.io/part-of: smart-library
data:
  # ---- where each microservice lives (ClusterIP Service names) ----
  REGISTRATION_URL: "http://registration-service:8001"
  LOGIN_URL: "http://login-service:8002"
  CATALOG_URL: "http://catalog-service:8003"
  MEMBER_URL: "http://member-service:8004"
  INVENTORY_URL: "http://inventory-service:8005"
  BORROWING_URL: "http://borrowing-service:8006"
  FINE_URL: "http://fine-service:8007"
  REVIEW_URL: "http://review-service:8008"

  # ---- shared log volume (mounted from the PersistentVolumeClaim in 03-storage.yaml) ----
  LOG_DIR: "/var/log/smartlibrary"
  LOG_FILE: "access.log"

  # ---- application tuning ----
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_MINUTES: "60"
  LOAN_DAYS: "14"
  MAX_ACTIVE_LOANS: "5"
  FINE_PER_DAY: "0.50"
  MAX_FINE: "20.00"
