# Fanout DNS on the domain aupp.com (guideline 5).
#
# ONE Ingress, ONE external IP, several backends chosen by host name and by path:
#
#        aupp.com/            ---> gateway:8000      (API docs / root)
#        aupp.com/api/...     ---> gateway:8000      (every client API call)
#        aupp.com/health      ---> gateway:8000      (aggregate health of all services)
#        aupp.com/logs/       ---> log-viewer:8080   (the shared log volume)
#
#        api.aupp.com/        ---> gateway:8000      (name-based virtual host for the API)
#        logs.aupp.com/       ---> log-viewer:8080   (name-based virtual host for the logs)
#
# Why the fanout does NOT break guideline 3 ("all client requests must be routed through the API
# Gateway"): every rule whose backend could serve application data points at the gateway. The only
# other backend is log-viewer, an operations view of the shared volume - no microservice is exposed
# directly. There is deliberately no Ingress rule for catalog-service, member-service, etc.
#
# SETUP - the cluster needs the NGINX ingress controller:
#     minikube addons enable ingress
# and your machine needs the names to resolve to the cluster. Run in an ADMIN PowerShell:
#     .\scripts\k8s-setup-dns.ps1
# which appends to C:\Windows\System32\drivers\etc\hosts:
#     <minikube ip>  aupp.com  api.aupp.com  logs.aupp.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-library-fanout
  namespace: smart-library
  labels:
    app.kubernetes.io/part-of: smart-library
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # /logs/foo is served by log-viewer as /foo
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    # ---------------- simple fanout: one host, several paths, two backends ----------------
    - host: aupp.com
      http:
        paths:
          - path: /logs(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: log-viewer
                port:
                  number: 8080
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: gateway
                port:
                  number: 8000

    # ---------------- name-based virtual hosting on the same IP ----------------
    - host: api.aupp.com
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: gateway
                port:
                  number: 8000

    - host: logs.aupp.com
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: log-viewer
                port:
                  number: 8080
