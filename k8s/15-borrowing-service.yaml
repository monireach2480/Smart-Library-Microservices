# Borrowing Service
# Loans and returns; calls Member, Inventory and Fine.
#
# Not reachable from outside the cluster: this is a ClusterIP Service with no Ingress rule of its own.
# All client traffic for it must go through the API Gateway (guideline 3).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: borrowing-service
  namespace: smart-library
  labels:
    app: borrowing-service
    tier: backend
    app.kubernetes.io/part-of: smart-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: borrowing-service
  template:
    metadata:
      labels:
        app: borrowing-service
        tier: backend
        app.kubernetes.io/part-of: smart-library
    spec:
      securityContext:
        runAsUser: 1000          # the `app` user created in the Dockerfile
        runAsGroup: 1000
        fsGroup: 1000            # makes the shared log volume group-writable by that user
      containers:
        - name: borrowing-service
          image: smart-library/borrowing-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8006
          env:
            # INSTANCE_ID = the Pod name, so X-Served-By identifies the exact replica
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smart-library-secrets
                  key: BORROWING_DATABASE_URL
            - name: MEMBER_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-library-config
                  key: MEMBER_URL
            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-library-config
                  key: INVENTORY_URL
            - name: FINE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-library-config
                  key: FINE_URL
            - name: LOAN_DAYS
              valueFrom:
                configMapKeyRef:
                  name: smart-library-config
                  key: LOAN_DAYS
            - name: MAX_ACTIVE_LOANS
              valueFrom:
                configMapKeyRef:
                  name: smart-library-config
                  key: MAX_ACTIVE_LOANS
          envFrom:
            - configMapRef:
                name: smart-library-config
            - secretRef:
                name: smart-library-secrets
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/smartlibrary     # matches LOG_DIR in the ConfigMap
          readinessProbe:
            httpGet: {path: /health, port: 8006}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: 8006}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: smart-library-logs
---
apiVersion: v1
kind: Service
metadata:
  name: borrowing-service
  namespace: smart-library
  labels:
    app: borrowing-service
    app.kubernetes.io/part-of: smart-library
spec:
  type: ClusterIP            # internal only - never a NodePort or a LoadBalancer
  selector:
    app: borrowing-service
  ports:
    - name: http
      port: 8006
      targetPort: 8006
