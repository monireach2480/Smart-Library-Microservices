# Enforces guideline 3 at the network layer: a microservice Pod accepts traffic ONLY from the
# gateway Pods (or from another microservice, for the internal service-to-service calls that
# Borrowing, Inventory and Review make). Nothing else in the cluster can reach them, so "direct
# client access to individual microservices" is impossible rather than merely discouraged.
#
# NOTE: Minikube's default CNI ignores NetworkPolicy. Start the cluster with a CNI that enforces it:
#     minikube start --cni=calico
# Without Calico these objects are still valid and still apply - they simply are not enforced, and
# the gateway-only rule is then enforced by the Ingress (no Ingress rule points at a microservice)
# and by every microservice Service being ClusterIP. Applying this file is safe either way.
---
# 1. Default deny: no Pod in the namespace accepts any ingress traffic unless a later policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: smart-library
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. Backend microservices accept traffic from the gateway and from each other, and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-gateway-only
  namespace: smart-library
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: edge        # the gateway Pods
        - podSelector:
            matchLabels:
              tier: backend     # Borrowing -> Member / Inventory / Fine, Review -> Catalog, ...
---
# 3. The gateway accepts traffic from the ingress-nginx controller (the public entry point).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-ingress
  namespace: smart-library
spec:
  podSelector:
    matchLabels:
      tier: edge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              tier: edge
---
# 4. The log viewer is an ops page: reachable from the ingress controller only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logviewer-from-ingress
  namespace: smart-library
spec:
  podSelector:
    matchLabels:
      tier: ops
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
