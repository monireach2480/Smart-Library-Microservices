# TEMPLATE - copy to k8s/02-secret.yaml, fill in the real values, and keep that copy out of git
# (.gitignore already excludes k8s/02-secret.yaml).
#
#   Copy-Item k8s/02-secret.example.yaml k8s/02-secret.yaml
#   notepad k8s/02-secret.yaml
#   kubectl apply -f k8s/02-secret.yaml
#
# Or generate it from your cloud database details:  .\scripts\k8s-make-secret.ps1
#
# DATABASE REQUIREMENT: every DATABASE_URL below must point at a CLOUD PostgreSQL instance
# (Neon, Supabase, Amazon RDS, Aiven, ...). No PostgreSQL container runs in this cluster - there is
# deliberately no postgres Deployment, Service or PersistentVolumeClaim anywhere in k8s/.
# Create the six databases first with deploy/cloud-db/init-cloud-databases.sql.
#
# Neon / Supabase connection strings must end with ?sslmode=require
apiVersion: v1
kind: Secret
metadata:
  name: smart-library-secrets
  namespace: smart-library
  labels:
    app.kubernetes.io/part-of: smart-library
type: Opaque
stringData:
  # ---- application secrets ----
  # SECRET_KEY must be at least 32 characters (enforced in app/core/config.py).
  # PowerShell:  -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 48 | % {[char]$_})
  SECRET_KEY: "CHANGE-ME-to-a-random-string-of-at-least-32-characters"
  INTERNAL_API_KEY: "CHANGE-ME-internal-service-to-service-key"
  ADMIN_REGISTRATION_KEY: "CHANGE-ME-admin-signup-key"

  # ---- cloud PostgreSQL, one database per service (database-per-service pattern) ----
  # Shape: postgresql+psycopg2://USER:PASSWORD@HOST/DBNAME?sslmode=require
  AUTH_DATABASE_URL: "postgresql+psycopg2://user:password@ep-xxxx.aws.neon.tech/auth_db?sslmode=require"
  CATALOG_DATABASE_URL: "postgresql+psycopg2://user:password@ep-xxxx.aws.neon.tech/catalog_db?sslmode=require"
  INVENTORY_DATABASE_URL: "postgresql+psycopg2://user:password@ep-xxxx.aws.neon.tech/inventory_db?sslmode=require"
  BORROWING_DATABASE_URL: "postgresql+psycopg2://user:password@ep-xxxx.aws.neon.tech/borrowing_db?sslmode=require"
  FINE_DATABASE_URL: "postgresql+psycopg2://user:password@ep-xxxx.aws.neon.tech/fine_db?sslmode=require"
  REVIEW_DATABASE_URL: "postgresql+psycopg2://user:password@ep-xxxx.aws.neon.tech/review_db?sslmode=require"
