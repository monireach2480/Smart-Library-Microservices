# API Gateway - the ONLY component reachable from outside the cluster (guideline 3).
#
# Every client request enters here. The gateway validates the JWT, applies the coarse role policy,
# refuses anything under /internal, and forwards to the right ClusterIP Service.
#
# This Pod also demonstrates the shared volume being used by TWO CONTAINERS IN THE SAME POD:
#   * `gateway`     writes a JSON line per request to /var/log/smartlibrary/access.log
#   * `log-tailer`  reads that same file (written by all 11 application containers) and prints it,
#                   so `kubectl logs deploy/gateway -c log-tailer` shows traffic from every service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: smart-library
  labels:
    app: gateway
    tier: edge
    app.kubernetes.io/part-of: smart-library
spec:
  replicas: 2                  # two gateway Pods; the Ingress load-balances between them
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: edge
        app.kubernetes.io/part-of: smart-library
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        # ---------- container 1: the gateway itself (writer) ----------
        - name: gateway
          image: smart-library/gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: smart-library-config     # all the *_URL values + LOG_DIR
            - secretRef:
                name: smart-library-secrets    # SECRET_KEY, INTERNAL_API_KEY
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/smartlibrary
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}

        # ---------- container 2: sidecar reading the SAME volume ----------
        - name: log-tailer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[log-tailer] reading the shared volume written by every Smart Library container"
              until [ -f /var/log/smartlibrary/access.log ]; do sleep 2; done
              exec tail -n +1 -F /var/log/smartlibrary/access.log
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/smartlibrary
              readOnly: true                   # this container only reads
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: smart-library-logs
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: smart-library
  labels:
    app: gateway
    app.kubernetes.io/part-of: smart-library
spec:
  type: ClusterIP              # exposed to the world only through the Ingress in 30-ingress.yaml
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
