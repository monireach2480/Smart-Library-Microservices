# Shared storage for application log files.
#
# Guideline 6: "Store log files or other shared application data in a Kubernetes Volume. Where
# applicable, demonstrate that the stored data can be accessed by multiple containers."
#
# This single ReadWriteMany PersistentVolume is mounted into:
#   * all 8 microservice Deployments (10 Pods, because Catalog runs 3 replicas)  -> WRITE
#   * the API Gateway Pod                                                        -> WRITE
#   * the `log-tailer` sidecar container inside the Gateway Pod                  -> READ
#   * the `log-viewer` Deployment, served at logs.aupp.com                       -> READ
# Every one of them works on the same /var/log/smartlibrary/access.log file.
#
# On Minikube the default `standard` StorageClass is the hostPath provisioner, which supports
# ReadWriteMany because every Pod lands on the same node. On a multi-node cluster (EKS) swap the
# storageClassName for an EFS / NFS class that really supports RWX.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: smart-library-logs-pv
  labels:
    app.kubernetes.io/part-of: smart-library
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: shared-logs
  hostPath:
    path: /data/smart-library-logs
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-library-logs
  namespace: smart-library
  labels:
    app.kubernetes.io/part-of: smart-library
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: shared-logs
  resources:
    requests:
      storage: 1Gi
  volumeName: smart-library-logs-pv
