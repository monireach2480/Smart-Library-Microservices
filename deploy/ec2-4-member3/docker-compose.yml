# EC2 #4  -  Member 3:  Fine service + Review service
services:
  fine-service:
    build: ../../services/fine-service
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      FINE_PER_DAY: ${FINE_PER_DAY:-0.50}
      MAX_FINE: ${MAX_FINE:-25.00}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-library}:${POSTGRES_PASSWORD:?set in .env}@${DB_HOST:?set in .env}:5432/fine_db
    ports: ["8007:8007"]

  review-service:
    build: ../../services/review-service
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      CATALOG_URL: http://${EC2_2_IP:?set in .env}:8003,http://${EC2_2_IP}:8013,http://${EC2_2_IP}:8023
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-library}:${POSTGRES_PASSWORD}@${DB_HOST}:5432/review_db
    ports: ["8008:8008"]
