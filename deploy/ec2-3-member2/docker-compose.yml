# EC2 #3  -  Member 2:  Inventory service + Borrowing service
services:
  inventory-service:
    build: ../../services/inventory-service
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in .env}
      CATALOG_URL: http://${EC2_2_IP:?set in .env}:8003,http://${EC2_2_IP}:8013,http://${EC2_2_IP}:8023
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-library}:${POSTGRES_PASSWORD:?set in .env}@${DB_HOST:?set in .env}:5432/inventory_db
    ports: ["8005:8005"]

  borrowing-service:
    build: ../../services/borrowing-service
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INVENTORY_URL: http://inventory-service:8005
      MEMBER_URL: http://${EC2_2_IP}:8004
      FINE_URL: http://${EC2_4_IP:?set in .env}:8007
      LOAN_DAYS: ${LOAN_DAYS:-14}
      MAX_ACTIVE_LOANS: ${MAX_ACTIVE_LOANS:-5}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-library}:${POSTGRES_PASSWORD}@${DB_HOST}:5432/borrowing_db
    ports: ["8006:8006"]
